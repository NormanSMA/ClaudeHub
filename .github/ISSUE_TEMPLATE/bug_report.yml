name: Reportar un error
description: Algo no funciona como esperabas
title: "[Error] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. No pegues el contenido de tus conversaciones ni rutas privadas.
        Si el error es de seguridad, no uses este formulario: lee SECURITY.md.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasó
      description: Describe el error y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrí la pestaña Sesiones
        2. Ordené por "Ultimo uso"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: como-lo-uso
    attributes:
      label: Cómo lo estás usando
      options:
        - Dashboard en el navegador (pnpm start)
        - Bandeja y mascota (pnpm tray)
        - Modo demo (pnpm demo)
        - Instalador de Windows
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de ClaudeHub
      placeholder: v0.2.0
  - type: input
    id: node
    attributes:
      label: Versión de Node.js
      description: Resultado de `node -v`.
      placeholder: v24.0.0
